<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Goober Dash performance profiles and monthly winner leaderboards.">
  <title>GooberStats</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./profile.css">
  <link rel="stylesheet" href="./monthly.css?v=20260815-1">
  <link rel="stylesheet" href="./theme.css?v=20260814-4">
</head>
<body>
  <main>
    <section id="winners" class="view active">
      <div class="winner-hero">
        <img class="winner-logo" src="./assets/goober-dash-logo.png" alt="Goober Dash">
        <div class="winner-heading">
          <h1><img class="winner-title-image" src="./assets/hero-biggest-winners.png" alt="Biggest Winners"></h1>
          <div class="month-switcher">
            <button class="month-arrow month-arrow-left" id="month-previous" type="button" aria-label="Newer month"><img src="./assets/month-arrow-left.png" alt=""></button>
            <p><img class="winner-month-image" id="winner-month" src="./assets/hero-2026-08.png" alt="August 2026"></p>
            <button class="month-arrow month-arrow-right" id="month-next" type="button" aria-label="Older month"><img src="./assets/month-arrow-right.png" alt=""></button>
          </div>
        </div>
      </div>
      <div class="site-time-control">
        <span id="updated-at">Updated —</span>
        <label for="site-timezone"><span>Time zone</span><select id="site-timezone"></select></label>
      </div>
      <div class="monthly-layout">
        <aside class="panel monthly-leaderboard"><div id="winner-list" class="monthly-rank-list"></div></aside>
      </div>
    </section>
  </main>
  <div id="profile-modal" class="profile-modal" hidden>
    <button class="profile-backdrop" type="button" aria-label="Close player profile"></button>
    <div class="profile-dialog" role="dialog" aria-modal="true" aria-label="Player profile">
      <button id="profile-close" class="profile-close" type="button" aria-label="Close player profile">×</button>
      <section id="monthly-profile" class="profile-panel"><div class="loading">Loading profile...</div></section>
    </div>
  </div>
  <footer>Independent Goober Dash statistics · Tracking coverage and confidence vary by player.</footer>
  <script src="./app.js?v=20260815-1" defer></script>
</body>
</html>
