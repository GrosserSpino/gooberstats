name: Update GooberStats data
on:
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GrosserSpino/goober-dash-tools
          path: tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build current profile source
        run: python "tools/Goober Profiles/build_profiles.py"
      - name: Export site data
        run: python scripts/build_site_data.py --tools-root tools
      - name: Commit changed data
        run: |
          git config user.name "gooberstats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Update GooberStats data"
          git push
