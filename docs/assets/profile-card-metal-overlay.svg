<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" preserveAspectRatio="none">
  <defs>
    <linearGradient id="outerMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".86"/>
      <stop offset=".09" stop-color="#fff" stop-opacity=".24"/>
      <stop offset=".32" stop-color="#000" stop-opacity=".38"/>
      <stop offset=".58" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".82" stop-color="#000" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="topShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".54"/>
      <stop offset=".08" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".48" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="panelEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".66"/>
      <stop offset=".18" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#000" stop-opacity=".44"/>
      <stop offset=".82" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".54"/>
    </linearGradient>
    <filter id="softInset" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Outer premium frame: several narrow bands create a machined-metal edge. -->
  <rect x="5" y="5" width="690" height="890" rx="38" fill="none" stroke="url(#outerMetal)" stroke-width="10"/>
  <rect x="14" y="14" width="672" height="872" rx="31" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
  <rect x="20" y="20" width="660" height="860" rx="26" fill="none" stroke="#000" stroke-opacity=".4" stroke-width="3"/>

  <!-- Transparent identity window with only a faint lower bevel. -->
  <rect x="21" y="21" width="658" height="255" rx="25" fill="url(#topShine)" opacity=".18"/>
  <path d="M25 276H675" stroke="#fff" stroke-opacity=".3" stroke-width="3"/>
  <path d="M26 282H674" stroke="#000" stroke-opacity=".45" stroke-width="5" filter="url(#softInset)"/>

  <!-- Stats and badge-panel metal rims. Interiors remain transparent for HTML. -->
  <rect x="22" y="294" width="656" height="390" rx="25" fill="none" stroke="url(#panelEdge)" stroke-width="7"/>
  <rect x="29" y="301" width="642" height="376" rx="19" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>
  <path d="M45 311H645" stroke="#fff" stroke-opacity=".22" stroke-width="4" stroke-linecap="round"/>

  <rect x="22" y="701" width="656" height="177" rx="25" fill="none" stroke="url(#panelEdge)" stroke-width="7"/>
  <rect x="29" y="708" width="642" height="163" rx="19" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>
  <path d="M45 718H645" stroke="#fff" stroke-opacity=".22" stroke-width="4" stroke-linecap="round"/>

  <!-- Sparse specular accents keep the metal deliberate rather than glossy plastic. -->
  <path d="M52 10H265" stroke="#fff" stroke-opacity=".62" stroke-width="3" stroke-linecap="round"/>
  <path d="M688 100V315" stroke="#fff" stroke-opacity=".2" stroke-width="3" stroke-linecap="round"/>
  <path d="M12 600V755" stroke="#fff" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>
  <path d="M430 891H615" stroke="#fff" stroke-opacity=".36" stroke-width="3" stroke-linecap="round"/>
</svg>
